services:
  neo4j:
    image: neo4j:5.15-community
    container_name: miroshark-neo4j
    environment:
      - NEO4J_AUTH=neo4j/miroshark
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  miroshark:
    build: .
    container_name: miroshark
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=miroshark
    ports:
      - "5001:5001"
    depends_on:
      - neo4j
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  neo4j_data:
